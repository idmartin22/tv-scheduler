function Card({ children, style = {} }) {
  return (
    <div style={{
      background: C.SUR, border: `1px solid ${C.BD}`,
      borderRadius: 16, padding: "14px 14px", marginBottom: 10,
      ...style,
    }}>
      {children}
    </div>
  );
}

function SectionLabel({ children }) {
  return (
    <div style={{
      fontSize: 9, fontWeight: 700, color: C.DM,
      letterSpacing: "0.1em", marginBottom: 10, textTransform: "uppercase",
    }}>
      {children}
    </div>
  );
}

function IconBtn({ label, sub, color, onClick, size = 1 }) {
  const [pressed, setPressed] = useState(false);
  return (
    <button
      onMouseDown={() => setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onMouseLeave={() => setPressed(false)}
      onTouchStart={() => setPressed(true)}
      onTouchEnd={() => setPressed(false)}
      onClick={onClick}
      style={{
        padding: "10px 6px", borderRadius: 12,
        background: pressed ? C.SUR3 : C.SUR2,
        border: `1px solid ${pressed ? C.BD2 : C.BD}`,
        cursor: "pointer", display: "flex",
        flexDirection: "column", alignItems: "center", gap: 4,
        transition: "all 0.1s", transform: pressed ? "scale(0.95)" : "scale(1)",
      }}
    >
      <span style={{ fontSize: 20 * size }}>{label}</span>
      {sub && <span style={{ fontSize: 9, fontWeight: 600, color: color || C.MT }}>{sub}</span>}
    </button>
  );
}

function NavPad({ onKey, onVolume, isTablet }) {
  const [touching, setTouching] = useState(null);

  const circleBtn = (label, key, style={}) => {
    const [p, setP] = useState(false);
    return (
      <button
        onMouseDown={() => setP(true)} onMouseUp={() => setP(false)}
        onMouseLeave={() => setP(false)}
        onTouchStart={() => setP(true)} onTouchEnd={() => setP(false)}
        onClick={() => onKey(key)}
        style={{
          width: isTablet ? 64 : 52, height: isTablet ? 64 : 52, borderRadius: "50%",
          background: p ? C.SUR3 : C.SUR2,
          border: `1px solid ${C.BD2}`,
          color: "#f1f5f9", cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 11, fontWeight: 700, letterSpacing: "0.03em",
          transition: "all 0.1s",
          transform: p ? "scale(0.9)" : "scale(1)",
          ...style,
        }}
      >
        {label}
      </button>
    );
  };

  return (
    <div>
      {/* Top row: INPUT MENU HOME MIC OPTIONS */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, padding:"0 4px" }}>
        {circleBtn("INPUT", "InputHDMI1")}
        {circleBtn("MENU", "Info")}
        <button
          onClick={() => onKey("Home")}
          style={{
            width: isTablet ? 76 : 62, height: isTablet ? 76 : 62, borderRadius:"50%",
            background: C.SUR3, border:`1px solid ${C.BD2}`,
            color:"#f1f5f9", cursor:"pointer", fontSize:22,
            display:"flex", alignItems:"center", justifyContent:"center",
            transition:"all 0.1s",
          }}
        >⌂</button>
        {circleBtn("⏮", "InstantReplay")}
        {circleBtn("•••", "Options")}
      </div>

      {/* D-pad — five discrete buttons on a 3x3 grid.
          Replaces the old single-surface trackpad, where the whole pad fired
          Select and the arrows were small transparent hit-zones (48x30 for
          up/down) butted straight against it. Any slightly-off tap on an arrow
          landed on OK. Now each key is its own element with a real gap around
          it, so a miss lands on nothing instead of the wrong command. */}
      <div style={{
        display:"flex", justifyContent:"center",
        // Extra breathing room above and below, more on phone than tablet:
        // the neighbouring rows only carry 12px of their own, which left the
        // whole cluster feeling cramped on a narrow screen.
        margin: isTablet ? "10px 0 18px" : "20px 0 28px",
      }}>
        <div style={{
          display:"grid",
          gridTemplateColumns:`repeat(3, ${isTablet ? 84 : 68}px)`,
          gridTemplateRows:`repeat(3, ${isTablet ? 84 : 68}px)`,
          gap: isTablet ? 12 : 12,
        }}>
          {[
            { r:1, c:2, label:"\u2227", key:"Up"     },
            { r:2, c:1, label:"\u2039", key:"Left"   },
            { r:2, c:2, label:"OK",     key:"Select" },
            { r:2, c:3, label:"\u203a", key:"Right"  },
            { r:3, c:2, label:"\u2228", key:"Down"   },
          ].map(b => {
            const [p, setP] = useState(false);
            const isOK = b.key === "Select";
            return (
              <button key={b.key}
                onMouseDown={() => setP(true)} onMouseUp={() => setP(false)}
                onMouseLeave={() => setP(false)}
                onTouchStart={() => setP(true)} onTouchEnd={() => setP(false)}
                onClick={() => onKey(b.key)}
                style={{
                  gridRow:b.r, gridColumn:b.c,
                  background: p ? C.SUR3 : (isOK ? C.SUR3 : C.SUR2),
                  border:`1px solid ${isOK ? C.BD2 : C.BD}`,
                  borderRadius: isOK ? "50%" : 14,
                  color: isOK ? "#f1f5f9" : "#cbd5e1",
                  fontSize: isOK ? (isTablet ? 16 : 14) : (isTablet ? 30 : 26),
                  fontWeight: isOK ? 700 : 400,
                  letterSpacing: isOK ? "0.1em" : 0,
                  lineHeight:1, cursor:"pointer", userSelect:"none",
                  display:"flex", alignItems:"center", justifyContent:"center",
                  transition:"all 0.1s",
                  transform: p ? "scale(0.92)" : "scale(1)",
                  boxShadow: p ? "none" : "inset 0 1px 0 rgba(255,255,255,0.05)",
                }}>{b.label}</button>
            );
          })}
        </div>
      </div>

      {/* Playback controls - Rev, Play, Fwd with more room */}
      <div style={{ display:"flex", justifyContent:"center", gap:16, marginBottom:12 }}>
        {[
          { icon:"⏪", key:"Rev",  label:"Rev"     },
          { icon:"⏯", key:"Play", label:"Play"    },
          { icon:"⏩", key:"Fwd",  label:"Fwd"     },
        ].map(b => {
          const [p, setP] = useState(false);
          return (
            <button key={b.key}
              onMouseDown={() => setP(true)} onMouseUp={() => setP(false)}
              onMouseLeave={() => setP(false)}
              onTouchStart={() => setP(true)} onTouchEnd={() => setP(false)}
              onClick={() => onKey(b.key)}
              style={{
                width: isTablet ? 70 : 58, height: isTablet ? 70 : 58, borderRadius:"50%",

function NumberPad({ input, onDigit, onClear, onSend }) {
  const keys = [1,2,3,4,5,6,7,8,9,"⌫",0,"▶"];
  return (
    <div>
      <div style={{
        background: C.SUR2, border: `1px solid ${C.BD}`,
        borderRadius: 10, padding: "8px 12px", marginBottom: 10,
        display: "flex", alignItems: "center", justifyContent: "space-between",
      }}>
        <span style={{ fontSize: 9, fontWeight: 700, color: C.DM, letterSpacing: "0.08em" }}>CHANNEL</span>
        <span style={{
          fontSize: 24, fontWeight: 800, letterSpacing: "0.1em",
          color: input ? "#f1f5f9" : C.DM, fontVariantNumeric: "tabular-nums",
          minWidth: 64, textAlign: "right",
        }}>
          {input || "—"}
        </span>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 7 }}>
        {keys.map((k, i) => {
          const isOK = k === "▶";
          const isDel = k === "⌫";
          const [p, setP] = useState(false);
          return (
            <button key={i}
              onMouseDown={() => setP(true)}
              onMouseUp={() => setP(false)}
              onMouseLeave={() => setP(false)}
              onClick={() => {
                if (isDel) onClear();
                else if (isOK) onSend();
                else onDigit(String(k));
              }}
              style={{
                height: 46, borderRadius: 10,
                background: isOK ? (p ? "rgba(249,115,22,0.7)" : C.ACC)
                           : isDel ? (p ? C.SUR3 : C.SUR3)
                           : (p ? C.SUR3 : C.SUR2),
                border: `1px solid ${isOK ? "transparent" : C.BD}`,
                color: isOK ? "#fff" : "#f1f5f9",
                fontSize: isDel ? 16 : isOK ? 14 : 17,
                fontWeight: isOK ? 800 : 600,
                cursor: "pointer", transition: "all 0.1s",
                transform: p ? "scale(0.93)" : "scale(1)",
                boxShadow: isOK ? "0 2px 10px rgba(249,115,22,0.25)" : "none",
              }}
            >
              {k}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── HOW THIS PAGE REACHES THE TVs ────────────────────────────────────────────
// Two ways, picked by where the page was served from:
//
//   from the bar proxy (192.168.1.150) — call it directly. Same network, no
//     hop through the internet, instant.
//   from GitHub Pages (https)          — go through the Cloudflare relay. A
//     browser will not let an https page call http://192.168.1.150, and the
//     bar PC accepts no connections from outside, so the proxy holds a socket
//     open to the relay and commands travel down it.
//
// Decided by hostname rather than by probing, so there is no race between the
// page loading and the first button press.
const RELAY_URL = 'https://bar-relay.isaac-d-martin.workers.dev';
const RELAY_KEY = 'jbUIOIZVsYHv2n6kuKxcv7zYmt-NkBPj';

const ON_LAN = (() => {
  const h = window.location.hostname;
  return h === 'localhost' || h === '127.0.0.1'
      || /^192\.168\./.test(h) || /^10\./.test(h)
      || /^172\.(1[6-9]|2\d|3[01])\./.test(h);
})();

const PROXY_URL = ON_LAN ? window.location.origin : null;

// One call, either route. Errors come back in the same shape from both, so
// nothing downstream has to care which one was used.
async function barFetch(path, method) {
  try {
    if (PROXY_URL) {
      const r = await fetch(PROXY_URL + path, { method });
      return await r.json();
    }
    const r = await fetch(RELAY_URL + '/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Bar-Key': RELAY_KEY },
      body: JSON.stringify({ path, method }),
    });
    return await r.json();
  } catch(e) {
    return { error: e.message };
  }
}

async function proxyPost(path) { return barFetch(path, 'POST'); }
async function proxyGet(path)  { return barFetch(path, 'GET'); }

function App() {
  const [selectedId, setSelectedId] = useState(1);
  const [screenW, setScreenW] = useState(window.innerWidth);
  const [tvStatus, setTvStatus] = useState({});
  const [poweringAllOff, setPoweringAllOff] = useState(false);
  const [poweringAllOn, setPoweringAllOn] = useState(false);

  React.useEffect(() => {
    const handler = () => setScreenW(window.innerWidth);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  // Poll TV power status every 30 seconds
  const pollStatus = React.useCallback(async () => {
    try {
      // proxyGet, not a bare fetch: over the relay PROXY_URL is null and this
      // would have polled the string "null/status/all" for ever, leaving every
      // TV's power dot blank with no error anywhere.
      const d = await proxyGet('/status/all');
      if (d.ok) setTvStatus(d.devices);
    } catch(e) {}
  }, []);

  React.useEffect(() => {
    pollStatus();
    const interval = setInterval(pollStatus, 30000);
    return () => clearInterval(interval);
  }, [pollStatus]);

  const handlePowerAllOff = async () => {
    setPoweringAllOff(true);
    setStatus('Powering off all TVs...');
    await proxyPost('/power/alloff');
    await pollStatus();
    setPoweringAllOff(false);
    setStatus('All TVs powered off');
    setTimeout(() => setStatus(null), 3000);
  };

  const handlePowerAllOn = async () => {
    setPoweringAllOn(true);
    setStatus('Powering on all TVs...');
    await proxyPost('/power/allon');
    setTimeout(async () => {
      await pollStatus();
      setPoweringAllOn(false);
      setStatus('All TVs powered on');
      setTimeout(() => setStatus(null), 3000);
    }, 3000);
  };
  const isTablet = screenW >= 600;
  const maxW = isTablet ? 720 : 390;
  const cols4 = isTablet ? 'repeat(6,1fr)' : 'repeat(4,1fr)';
  const appCols = isTablet ? 'repeat(6,1fr)' : 'repeat(4,1fr)';
  const navGap = isTablet ? 20 : 10;
  const btnSize = isTablet ? 62 : 46;
  const trackH = isTablet ? '220px' : '160px';
  const [showNumPad, setShowNumPad] = useState(false);
  const [showAllChannels, setShowAllChannels] = useState(false);
  const [tvOn, setTvOn] = useState(true);
  const [chanInput, setChanInput]   = useState("");
  const [status, setStatus]         = useState(null);
  const [volume, setVolume]         = useState(50);

  const device = DEVICES.find(d => d.id === selectedId);

  // Map Roku key names to Vizio key names
  const ROKU_TO_VIZIO = {
    'Up': 'up', 'Down': 'down', 'Left': 'left', 'Right': 'right',
    'Select': 'select', 'Back': 'back', 'Home': 'home', 'Info': 'menu',
    'Play': 'play', 'Rev': 'rewind', 'Fwd': 'fast_forward',
    'InstantReplay': 'back',
  };

  const sendKey = async (key) => {
    const devKey = device.proxyKey;
    setStatus(`Sending: ${key}`);
    let res;
    if (device.type === 'vizio') {
      const vizioKey = ROKU_TO_VIZIO[key];
      if (vizioKey) {
        res = await proxyPost(`/device/${devKey}/vizio/key/${vizioKey}`);
      } else {
        setStatus(`Key ${key} not supported on Vizio`);
        setTimeout(() => setStatus(null), 1500);
        return;
      }
    } else if (device.type === 'xumo') {
      // The proxy maps Roku key names to the box's own vocabulary.
      res = await proxyPost(`/device/${devKey}/xumo/key/${key}`);
    } else {
      res = await proxyPost(`/device/${devKey}/key/${key}`);
    }
    if (res.error) setStatus(`Error: ${res.error}`);
    else setStatus(null);
  };

  const handlePower = async () => {
    const devKey = device.proxyKey;
    const newState = !tvOn;
    setTvOn(newState);
    setStatus(newState ? "Powering on..." : "Powering off...");
    if (device.type === 'vizio') {
      await proxyPost(`/device/${devKey}/vizio/power/${newState ? 'on' : 'off'}`);
    } else if (device.type === 'xumo') {
      // On is Wake-on-LAN: in standby the box drops its TLS listener, so no
      // key press can reach it. Off is the Power key.
      await proxyPost(`/device/${devKey}/xumo/power/${newState ? 'on' : 'off'}`);
    } else {
      await proxyPost(`/device/${devKey}/power`);
    }
    setTimeout(() => setStatus(null), 2000);
  };

  const handleVolume = async (action) => {
    const devKey = device.proxyKey;
    if (device.type === 'vizio') {
      await proxyPost(`/device/${devKey}/vizio/volume/${action}`);
    } else if (device.type === 'xumo') {
      if (action === 'up') sendKey('VolumeUp');
      else if (action === 'down') sendKey('VolumeDown');
      else sendKey('VolumeMute');
    } else {
      if (action === 'up') sendKey('VolumeUp');
      else if (action === 'down') sendKey('VolumeDown');
      else sendKey('VolumeMute');
    }
  };
  // Map app display names to proxy keys
  const ROKU_APP_IDS = {
    'Spectrum TV': '23048', 'Prime': '13',       'Paramount+': '31440',
    'ESPN':        '34376', 'Peacock': '593099',  'Netflix':    '12',
    'Apple TV':    '551012','Max':    '61322',    'Hulu':       '2285',
    'Disney+':     '291097','YouTube TV': '195316','ViX':       '552828',
    // Read off the device 2026-09-13: <app id="13842" ...>Fandango</app>
    'Fandango':    '13842',
    // Read off Bar 6 on 2026-10-12:
    //   <app id="158987" ...>DAZN Live Sports Streaming</app>
    'DAZN':        '158987',
  };
  // Fire TV launches by Android package name, not a numeric id.
  // Verified against `pm list packages -3` on Bar 4, 2026-09-13. Fire TV uses
  // vendor-specific packages, not the standard Android ones - 7 of 12 initial
  // guesses were wrong (ESPN is .gtv not .score_center, Hulu is .plus not
  // .livingroomplus, Max is still the old hbonow package, and so on).
  // Prime Video ships preinstalled so it never appears under -3; com.amazon.avod
  // is its long-standing package and launches fine.
  const FIRETV_APP_PKGS = {
    'Spectrum TV': 'com.spectrum.stva.firetv', 'Prime':   'com.amazon.firebat',
    'Paramount+':  'com.cbs.ott',              'ESPN':    'com.espn.gtv',
    'Peacock':     'com.peacock.peacockfiretv','Netflix': 'com.netflix.ninja',
    'Apple TV':    'com.apple.atve.amazon.appletv',
    'Max':         'com.hbo.hbonow',           'Hulu':    'com.hulu.plus',
    'Disney+':     'com.disney.disneyplus',    'YouTube TV': 'com.amazon.firetv.youtube.tv',
    'ViX':         'com.univision.prendetv',
    'Fandango':    'com.fandango.vudu.firetv',
    // Read off Bar 8 on 2026-10-12. This one IS the plain Android package —
    // confirmed by reading it, not assumed, since 7 of the 12 packages first
    // guessed for this map were wrong.
    'DAZN':        'com.dazn',
  };
  const VIZIO_APP_KEYS = {
    'Spectrum TV': 'spectrum', 'Prime': 'prime',      'Paramount+': 'paramount',
    'ESPN':        'espn',     'Peacock': 'peacock',  'Netflix':    'netflix',
    'Apple TV':    'appletv',  'Max':    'hbomax',    'Hulu':       'hulu',
    'Disney+':     'disneyplus','YouTube TV': 'youtubetv','ViX':    'vix',
    'Fandango':    'fandango',
    'DAZN':        'dazn',
  };

  const launchApp = async (app) => {
    const devKey = device.proxyKey;
    setStatus(`Launching ${app.name}...`);
    let res;
    if (device.type === 'vizio') {
      const vizioKey = VIZIO_APP_KEYS[app.name];
      if (vizioKey) res = await proxyPost(`/device/${devKey}/vizio/launch/${vizioKey}`);
      else { setStatus(`${app.name} not configured for Vizio`); return; }
    } else if (device.type === 'xumo') {
      // No launch API on this box — the firmware takes key presses only. Each
      // app is a recorded macro (Home, arrows, Enter) in xumo/macros.json,
      // which is how the official remote app opens apps too. Slow by nature:
      // the far end of the row is 17 presses.
      setStatus(`Opening ${app.name}...`);
      res = await proxyPost(`/device/${devKey}/xumo/launch/${encodeURIComponent(app.name)}`);
    } else if (device.type === 'firetv') {
      const pkg = FIRETV_APP_PKGS[app.name];
      if (pkg) res = await proxyPost(`/device/${devKey}/launch/${encodeURIComponent(pkg)}`);
      else { setStatus(`${app.name} not configured for Fire TV`); return; }
    } else {
      const appId = ROKU_APP_IDS[app.name];
      if (appId) res = await proxyPost(`/device/${devKey}/launch/${appId}`);
      else { setStatus(`No app ID for ${app.name}`); return; }
    }
    if (res?.error) setStatus(`Error: ${res.error}`);
    else setStatus(`✓ ${app.name} launched`);
    setTimeout(() => setStatus(null), 3000);
  };
  // `dev` defaults to the selected TV. It is a parameter so a command arriving
  // from outside can act on a TV immediately, without waiting a render for
  // setSelectedId to land — a state setter would leave this closure holding
  // the OLD device and tune the wrong TV.
  const tuneCh = async (ch, dev = device) => {
    // proxyKey, not `tv${dev.id}`: the two agree for every device today, but
    // the DEVICES comment says display order comes from the array and not the
    // key, so the day a key stops matching its id this would quietly tune
    // someone else's TV.
    const devKey = dev.proxyKey;
    setStatus(`Tuning to ${ch}...`);
    // If ch is a number (direct entry), use /tune/:number
    // If ch is a name (quick tune), use /tunename/:name
    const isNumber = /^\d+$/.test(String(ch));
    const endpoint = isNumber
      ? `/device/${devKey}/tune/${ch}`
      : `/device/${devKey}/tunename/${encodeURIComponent(ch)}`;
    const res = await proxyPost(endpoint);
    if (res.error) setStatus(`Error: ${res.error}`);
    else setStatus(`✓ Tuned to ${ch}`);
    setTimeout(() => setStatus(null), 4000);
  };

  // ── COMMANDS FROM OUTSIDE ───────────────────────────────────────────────────
  // The grid embeds this page in a frame. Both are served by the proxy, so
  // they are same-origin and the grid can say "put this on Bar 6" either by
  // loading ?device=tv6&tune=250 or, for a frame already open, by posting a
  // message to it. Nothing here runs when the page is opened normally.
  //
  //   /remote.html?device=tv6&tune=250
  //   /remote.html?device=Bar%206&tune=NFL%20Network
  //   /remote.html?device=tv12&app=Peacock
  //   frame.contentWindow.postMessage({type:'remote',device:'tv6',tune:250},'*')
  const findDevice = (spec) => {
    if (spec === undefined || spec === null || spec === '') return null;
    const s = String(spec).trim(), low = s.toLowerCase();
    return DEVICES.find(d => d.proxyKey.toLowerCase() === low)
        || DEVICES.find(d => String(d.id) === s)
        || DEVICES.find(d => d.name.toLowerCase() === low)
        || null;
  };

  const runCommand = React.useCallback(async (cmd) => {
    if (!cmd) return;
    let dev = device;
    if (cmd.device !== undefined && cmd.device !== null && cmd.device !== '') {
      const found = findDevice(cmd.device);
      if (!found) {
        setStatus(`Unknown TV "${cmd.device}"`);
        setTimeout(() => setStatus(null), 4000);
        return;
      }
      dev = found;
      setSelectedId(found.id);          // so the UI follows the command
    }
    if (cmd.app) {
      // The proxy resolves the app per platform (/device/:id/app/:name), which
      // is why this does not repeat the three id maps the tiles use. It also
      // reaches apps the tiles do not have, such as FOX One.
      setStatus(`Opening ${cmd.app} on ${dev.name}...`);
      const res = await proxyPost(
        `/device/${dev.proxyKey}/app/${encodeURIComponent(cmd.app)}`);
      if (res?.error) setStatus(`Error: ${res.error}`);
      else setStatus(`✓ ${cmd.app} on ${dev.name}`);
      setTimeout(() => setStatus(null), 4000);
      return;
    }
    if (cmd.tune !== undefined && cmd.tune !== null && cmd.tune !== '') {
      await tuneCh(cmd.tune, dev);
    }
  }, [device]);

  // URL parameters, once, on load.
  const urlCmdDone = useRef(false);
  React.useEffect(() => {
    if (urlCmdDone.current) return;
    urlCmdDone.current = true;
    const q = new URLSearchParams(window.location.search);
    const cmd = { device: q.get('device'), tune: q.get('tune'), app: q.get('app') };
    if (cmd.device || cmd.tune || cmd.app) runCommand(cmd);
  }, []);   // deliberately not [runCommand] — this must fire exactly once

  // Messages, for a frame that is already open.
  React.useEffect(() => {
    const onMsg = (e) => {
      // Same-origin only. The grid and this page are both served by the proxy,
      // so anything from elsewhere has no business driving the TVs.
      if (e.origin !== window.location.origin) return;
      const d = e.data;
      if (!d || d.type !== 'remote') return;
      runCommand(d);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [runCommand]);

          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:16, fontWeight:800, color:"#f1f5f9", letterSpacing:"-0.02em" }}>
                🎮 Remote
              </div>
              <div style={{ fontSize:10, color:C.MT, marginTop:1 }}>
                {device.name} · {device.size}" {device.type}
              </div>
            </div>
            {/* Connected status + All On / All Off in header */}
            <div style={{ display:"flex", gap:6, alignItems:"center" }}>
              <div style={{
                display:"flex", alignItems:"center", gap:4,
                background:"rgba(34,197,94,0.1)",
                border:"1px solid rgba(34,197,94,0.25)",
                borderRadius:20, padding:"3px 8px",
              }}>
                <div style={{ width:6, height:6, borderRadius:"50%", background:C.GRN, boxShadow:`0 0 6px ${C.GRN}` }}/>
                <span style={{ fontSize:9, fontWeight:600, color:C.GRN }}>Online</span>
              </div>
              {(()=>{ const [p, setP] = useState(false); return (
                <button
                  onMouseDown={() => setP(true)} onMouseUp={() => setP(false)}
                  onMouseLeave={() => setP(false)}
                  onClick={handlePowerAllOn}
                  disabled={poweringAllOn}
                  style={{
                    padding:"5px 10px", borderRadius:8,
                    background: p ? "rgba(34,197,94,0.25)" : "rgba(34,197,94,0.1)",
                    border:`1px solid rgba(34,197,94,${p ? "0.6" : "0.3"})`,
                    cursor:"pointer", display:"flex", alignItems:"center", gap:5,
                    opacity: poweringAllOn ? 0.6 : 1, transition:"all 0.1s",
                  }}
                >
                  <span style={{ fontSize:12 }}>⏻</span>
                  <span style={{ fontSize:10, fontWeight:700, color:C.GRN }}>
                    {poweringAllOn ? "On..." : "All On"}
                  </span>
                </button>
              );})()}
              {(()=>{ const [p, setP] = useState(false); return (
                <button
                  onMouseDown={() => setP(true)} onMouseUp={() => setP(false)}
                  onMouseLeave={() => setP(false)}
                  onClick={handlePowerAllOff}
                  disabled={poweringAllOff}
                  style={{
                    padding:"5px 10px", borderRadius:8,
                    background: p ? "rgba(239,68,68,0.25)" : "rgba(239,68,68,0.1)",
                    border:`1px solid rgba(239,68,68,${p ? "0.6" : "0.3"})`,
                    cursor:"pointer", display:"flex", alignItems:"center", gap:5,
                    opacity: poweringAllOff ? 0.6 : 1, transition:"all 0.1s",
                  }}
                >
                  <span style={{ fontSize:12 }}>⏻</span>
                  <span style={{ fontSize:10, fontWeight:700, color:C.RED }}>
                    {poweringAllOff ? "Off..." : "All Off"}
                  </span>
                </button>
              );})()}
            </div>
          </div>
        </div>

        <div style={{ padding:"12px 12px 0" }}>

          {/* TV SELECTOR — compact dropdown */}
          <div style={{
            display:"flex", alignItems:"center", gap:10,
            background:C.SUR, border:`1px solid ${C.BD}`,
            borderRadius:14, padding:"10px 14px", marginBottom:10,
          }}>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:9, fontWeight:700, color:C.DM, letterSpacing:"0.08em", marginBottom:4 }}>NOW CONTROLLING</div>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                {tvStatus[device.proxyKey] && (
                  <div style={{
                    width:8, height:8, borderRadius:"50%", flexShrink:0,
                    background: tvStatus[device.proxyKey].on === true ? C.GRN
                              : tvStatus[device.proxyKey].on === false ? "#334455" : C.DM,
                    boxShadow: tvStatus[device.proxyKey].on === true ? `0 0 6px ${C.GRN}` : "none",
                  }}/>
                )}
                <div style={{ fontSize:14, fontWeight:800, color:"#f1f5f9" }}>{device.name}</div>
                <div style={{ fontSize:10, color:C.MT }}>{device.size ? `${device.size}" · ` : ""}{device.type}</div>
              </div>
              {/* Mini status for all TVs */}
              <div style={{ display:"flex", gap:6, marginTop:4, flexWrap:"wrap" }}>
                {DEVICES.filter(d => d.type !== 'tbd' && tvStatus[d.proxyKey]).map(d => (
                  <div key={d.id} style={{ display:"flex", alignItems:"center", gap:3 }}>
                    <div style={{
                      width:6, height:6, borderRadius:"50%",
                      background: tvStatus[d.proxyKey].on === true ? C.GRN : "#334455",
                      boxShadow: tvStatus[d.proxyKey].on === true ? `0 0 4px ${C.GRN}` : "none",
                    }}/>
                    <span style={{ fontSize:8, color:C.DM }}>{d.name.replace('Basement ','B').replace('Bar ','')}</span>
                  </div>
                ))}
              </div>
            </div>
            <select
              value={selectedId}
              onChange={e => setSelectedId(Number(e.target.value))}
              style={{
                background:C.SUR2, border:`1px solid ${C.BD2}`,
                borderRadius:8, color:"#f1f5f9", fontSize:11,
                fontWeight:600, padding:"6px 10px", cursor:"pointer",
                outline:"none", appearance:"auto",
              }}
            >
              {DEVICES.map(d => (
                <option key={d.id} value={d.id}>{d.name}</option>
              ))}
            </select>
            {/* Power button inline */}
            {(()=>{ const [pw, setPw] = useState(false);
              const pwColor = tvOn ? C.GRN : C.RED;
              const pwBg = tvOn ? "rgba(34,197,94,0.1)" : "rgba(239,68,68,0.1)";
              const pwBorder = tvOn ? "rgba(34,197,94,0.35)" : "rgba(239,68,68,0.35)";
              return (
              <button
                onMouseDown={() => setPw(true)} onMouseUp={() => setPw(false)}
                onMouseLeave={() => setPw(false)}
                onClick={() => handlePower()}
                style={{
                  width:48, height:48, borderRadius:12, flexShrink:0,
                  background: pw ? pwBg.replace("0.1","0.25") : pwBg,
                  border:`1px solid ${pw ? pwColor : pwBorder}`,
                  cursor:"pointer", display:"flex", flexDirection:"column",
                  alignItems:"center", justifyContent:"center", gap:2,
                  transition:"all 0.15s",
                  transform: pw ? "scale(0.93)" : "scale(1)",
                  boxShadow: tvOn ? "0 0 8px rgba(34,197,94,0.2)" : "none",
                }}
              >
                <img src={tvOn ? ICONS.power_green : ICONS.power_red}
                  style={{ width:26, height:26, objectFit:"contain" }} />
              </button>
            );})()}
          </div>

          {/* NAVIGATE */}
          <Card>
            <NavPad onKey={sendKey} onVolume={handleVolume} isTablet={isTablet} />
            {status && (
              <div style={{
                marginTop:8, fontSize:10, fontWeight:500,
                color:status.startsWith('Error') ? C.RED : C.MT,
                textAlign:"center", opacity:0.8,
              }}>
                {status}
              </div>
            )}
          </Card>
{/* DIRECT CHANNEL ENTRY */}
          <Card style={{ padding:0, overflow:"hidden", marginBottom:10 }}>
            <button onClick={() => setShowNumPad(p => !p)} style={{
              width:"100%", padding:"10px 14px", background:"transparent",
              border:"none", cursor:"pointer",
              display:"flex", alignItems:"center", justifyContent:"space-between",
            }}>
              <span style={{ fontSize:11, fontWeight:600, color:"#f1f5f9" }}>
                # Direct Channel Entry
              </span>
              <span style={{
                color:C.MT, fontSize:11,
                display:"inline-block",
                transform: showNumPad ? "rotate(180deg)" : "rotate(0deg)",
                transition:"transform 0.2s",
              }}>▼</span>
            </button>
            {showNumPad && (
              <div style={{ padding:"0 14px 14px" }}>
                <NumberPad
                  input={chanInput}
                  onDigit={d => setChanInput(p => p.length < 4 ? p+d : p)}
                  onClear={() => setChanInput(p => p.slice(0,-1))}
                  onSend={() => { if(chanInput){ tuneCh(chanInput); setChanInput(""); setShowNumPad(false); }}}
                />
              </div>
            )}
          </Card>



          {/* QUICK TUNE CHANNELS — collapsible */}
          {(()=>{
            const [pressedCh, setPressedCh] = useState(null);
            const visibleCh = QUICK_CHANNELS;
            return (
              <Card style={{ padding:0, overflow:"hidden" }}>
                <div style={{ padding:"12px 14px 8px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <span style={{ fontSize:13, fontWeight:700, color:"#f1f5f9" }}>Quick Tune Channels</span>
                  <span style={{ fontSize:9, color:C.DM }}>scroll →</span>
                </div>
                <div style={{ overflowX:"auto", WebkitOverflowScrolling:"touch", scrollbarWidth:"none", paddingBottom:10 }}>
                  <div style={{ display:"flex", gap:8, padding:"0 10px", width:"max-content" }}>
                    {visibleCh.map(ch => (
                      <button key={ch.name}
                        onMouseDown={() => setPressedCh(ch.name)}
                        onMouseUp={() => setPressedCh(null)}
                        onMouseLeave={() => setPressedCh(null)}
                        onTouchStart={() => setPressedCh(ch.name)}
                        onTouchEnd={() => setPressedCh(null)}
                        onClick={() => tuneCh(ch.name)}
                        title={ch.name}
                        style={{
                          padding:0, borderRadius:10, overflow:"hidden",
                          border:`1.5px solid ${pressedCh===ch.name ? ch.color : ch.color + "50"}`,
                          cursor:"pointer", display:"flex", flexDirection:"column",
                          transition:"all 0.1s", flexShrink:0,
                          width: isTablet ? 90 : 72,
                          transform: pressedCh===ch.name ? "scale(0.92)" : "scale(1)",
                          background: ch.bg,
                        }}
                      >
                        <img src={ICONS[ch.iconKey]} alt={ch.name}
                          style={{ width: isTablet ? 90 : 72, height:72, objectFit:"cover", display:"block" }} />
                        <div style={{ padding:"3px 0", background:"rgba(0,0,0,0.6)", textAlign:"center" }}>
                          <span style={{ fontSize:7, fontWeight:600, color:"#94a3b8" }}>ch {ch.ch}</span>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              </Card>
            );
          })()}

          {/* STREAMING SERVICES */}
          <Card style={{ padding:0, overflow:"hidden" }}>
            <div style={{ padding:"12px 14px 8px" }}>
              <span style={{ fontSize:13, fontWeight:700, color:"#f1f5f9" }}>Streaming Services</span>
            </div>
            <div style={{ padding:"0 10px 10px" }}>
              <div style={{ display:"grid", gridTemplateColumns:`repeat(${isTablet ? 6 : 4},1fr)`, gap: isTablet ? 8 : 7 }}>
                {(()=>{ const [pressedApp, setPressedApp] = useState(null); return APPS.map(app => (
                    <button key={app.name}
                      onMouseDown={() => setPressedApp(app.name)}
                      onMouseUp={() => setPressedApp(null)}
                      onMouseLeave={() => setPressedApp(null)}
                      onTouchStart={() => setPressedApp(app.name)}
                      onTouchEnd={() => setPressedApp(null)}
                      onClick={() => launchApp(app)}
                      style={{
                        padding:0, borderRadius:12, overflow:"hidden",
                        border:`1px solid ${pressedApp===app.name ? app.color + "80" : app.color + "30"}`,
                        cursor:"pointer", display:"flex", flexDirection:"column",
                        transition:"all 0.1s",
                        transform: pressedApp===app.name ? "scale(0.92)" : "scale(1)",
                        background: `${app.color}12`,
                      }}
                    >
                      <img src={ICONS[app.iconKey]} alt={app.name}
                        style={{ width:"100%", aspectRatio:"1", objectFit:"cover", display:"block",
                                 borderRadius:"17.5%" }} />
                      <div style={{ padding:"3px 2px", background:"rgba(0,0,0,0.5)", textAlign:"center" }}>
                        <span style={{ fontSize:8, fontWeight:600, color:"#7a8fa8", lineHeight:1 }}>
                          {app.name}
                        </span>
                      </div>
                    </button>
                  ));})()}
              </div>
            </div>
          </Card>



        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
